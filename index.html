<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Gym Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  /* Layout: one narrow column of logbook cards over a fixed bottom tab bar; numbers set condensed like plate stamps. */
  :root {
    --bg: #eef1f4; --card: #ffffff; --fg: #15191e; --muted: #5f6b78; --line: #d8dee5;
    --field: #f5f7f9; --accent: #1d5bd1; --on-accent: #ffffff; --good: #15803d; --danger: #c62828;
    --plate-red: #d23b32; --plate-blue: #1d5bd1; --plate-yellow: #e0b20e; --plate-green: #2f8f4e; --plate-white: #f4f4f4; --plate-black: #2a2f36;
    --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --card: #181c22; --fg: #e7eaee; --muted: #95a0ad; --line: #29303a;
      --field: #11151a; --accent: #5b8ff0; --on-accent: #0b1020; --good: #3fbf6a; --danger: #ef5350;
      --plate-white: #d9dde2; --plate-black: #444c57; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --card: #181c22; --fg: #e7eaee; --muted: #95a0ad; --line: #29303a;
    --field: #11151a; --accent: #5b8ff0; --on-accent: #0b1020; --good: #3fbf6a; --danger: #ef5350;
    --plate-white: #d9dde2; --plate-black: #444c57; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); }
  main { max-width: 620px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 96px; display: grid; gap: 12px; }
  h1 { font: 700 30px/1.1 var(--display); letter-spacing: .01em; margin: 4px 0 0; text-wrap: balance; }
  h2 { font: 700 20px/1.2 var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%; min-width: 0; font: 500 17px var(--body); color: var(--fg); background: var(--field);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px;
  }
  input[type=number] { font: 700 22px var(--display); font-variant-numeric: tabular-nums; padding-block: 7px; }
  input::placeholder { color: var(--muted); opacity: .8; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font: 600 15px var(--body); border: 0; border-radius: 8px; padding: 11px 14px; cursor: pointer; background: var(--accent); color: var(--on-accent); }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
  button.x { background: transparent; color: var(--muted); padding: 4px 10px; font-weight: 500; font-size: 14px; }
  button.x.armed { color: var(--danger); border: 1px solid var(--danger); }
  button.confirm { background: var(--danger); color: #fff; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row > * { flex: 1; min-width: 0; }
  .row > .shrink { flex: 0 0 auto; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .num { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; }
  .sets { margin: 0; padding: 0; list-style: none; }
  .sets li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .sets li:first-child { border-top: 0; }
  .sets li.editing { display: grid; gap: 8px; justify-content: stretch; padding: 10px 0; }
  .sets .idx { color: var(--muted); font-size: 13px; width: 44px; display: inline-block; }
  .sets .num { font-size: 20px; }
  .pr { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--good); border: 1px solid var(--good); vertical-align: 2px; }
  .plates { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 28px; font-size: 13px; color: var(--muted); }
  .plate { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 26px; padding: 0 6px; border-radius: 4px; font: 700 14px var(--display); color: #fff; }
  .p-red { background: var(--plate-red); } .p-blue { background: var(--plate-blue); } .p-yellow { background: var(--plate-yellow); color: #221a00; }
  .p-green { background: var(--plate-green); } .p-white { background: var(--plate-white); color: #1a1a1a; border: 1px solid var(--line); } .p-black { background: var(--plate-black); }
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav button { flex: 1; min-width: 0; background: transparent; color: var(--muted); border-radius: 0; padding: 15px 0; font: 700 16px var(--display); letter-spacing: .03em; text-transform: uppercase; }
  nav button[aria-current="page"] { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--field); border-radius: 8px; padding: 8px; text-align: center; }
  .stat .num { display: block; font-size: 26px; line-height: 1.1; }
  .stat span:last-child { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  svg { width: 100%; height: auto; display: block; }
  .c-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
  .c-area { fill: var(--accent); opacity: .12; }
  .c-dot { fill: var(--card); stroke: var(--accent); stroke-width: 2; }
  .c-end { fill: var(--accent); }
  .c-grid { stroke: var(--line); stroke-width: 1; }
  .c-label { fill: var(--muted); font: 12px var(--body); }
  .empty { padding: 20px 4px; text-align: center; }
  .status { font-size: 13px; color: var(--muted); }
  .sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .sync[data-kind="synced"]::before { background: var(--good); }
  .sync[data-kind="saving"]::before, .sync[data-kind="connecting"]::before { background: var(--accent); }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 420px;
    background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 14px; text-align: center; }
  textarea { width: 100%; min-height: 90px; font: 13px ui-monospace, monospace; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .core { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: var(--accent); color: var(--on-accent); vertical-align: 2px; }
  .plan-list { margin: 0; padding: 0; list-style: none; }
  .plan-list li { border-top: 1px solid var(--line); }
  .plan-list li:first-child { border-top: 0; }
  .plan-list button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: transparent; color: var(--fg); padding: 10px 2px; border-radius: 0; text-align: left; font-weight: 500; }
  .plan-list .meta { font-size: 13px; color: var(--muted); display: block; font-weight: 400; }
  .count { flex: 0 0 auto; font: 700 16px var(--display); font-variant-numeric: tabular-nums; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .count.full { color: var(--good); border-color: var(--good); }
  .confirm-box { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--accent); border-radius: 8px; }
  .phase { background: var(--field); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  .weeks { display: grid; grid-template-columns: auto repeat(3, 1fr); gap: 6px; align-items: center; }
  .weeks .wk { font: 700 15px var(--display); color: var(--muted); padding-right: 4px; }
  .weeks .colhead { font-size: 12px; color: var(--muted); text-align: center; font-weight: 600; }
  .sess { min-width: 0; padding: 8px 2px; font: 600 13px var(--display); letter-spacing: 0; white-space: nowrap; background: var(--field); color: var(--fg); border: 1px solid var(--line); }
  .sess.done { background: var(--good); color: #fff; border-color: var(--good); }
  .sess.current { outline: 2px solid var(--accent); outline-offset: 1px; }
  .template { display: grid; gap: 4px; }
  .template ol { margin: 0; padding-left: 20px; font-size: 15px; }
  @media (prefers-reduced-motion: no-preference) { nav button { transition: color .15s; } }
</style>

<main>
  <!-- LOG -->
  <section id="view-log" style="display:grid;gap:12px">
    <div>
      <div class="head"><span class="eyebrow" id="today-label"></span><span class="sync" id="sync" data-kind="connecting" role="status">Connecting…</span></div>
      <h1>Today's workout</h1>
    </div>
    <div class="card" id="session"></div>
    <form class="card" id="add-form" autocomplete="off">
      <div>
        <label for="ex">Exercise</label>
        <input id="ex" list="ex-list" enterkeyhint="next">
        <datalist id="ex-list"></datalist>
      </div>
      <div class="row">
        <div><label for="w">Weight (<span class="unit">lb</span>)</label><input id="w" type="number" inputmode="decimal" step="any" min="0"></div>
        <div><label for="r">Reps</label><input id="r" type="number" inputmode="numeric" min="1"></div>
        <button class="shrink" id="add" type="submit">Add set</button>
      </div>
      <div class="plates" id="plates" aria-live="polite"></div>
    </form>
    <div id="today" style="display:grid;gap:12px"></div>
  </section>

  <!-- PLAN -->
  <section id="view-plan" hidden style="display:grid;gap:12px">
    <h1>8-week plan</h1>
    <div class="card" id="plan-grid"></div>
    <div id="plan-days" style="display:grid;gap:12px"></div>
  </section>

  <!-- HISTORY -->
  <section id="view-history" hidden style="display:grid;gap:12px">
    <h1>History</h1>
    <div id="history" style="display:grid;gap:12px"></div>
  </section>

  <!-- PROGRESS -->
  <section id="view-progress" hidden style="display:grid;gap:12px">
    <h1>Progress</h1>
    <div class="card">
      <div><label for="pick">Exercise</label><select id="pick"></select></div>
      <div id="progress" style="display:grid;gap:10px"></div>
    </div>
    <div class="card">
      <h2>Settings</h2>
      <div><label for="unit">Units</label>
        <select id="unit"><option value="lb">Pounds (lb)</option><option value="kg">Kilograms (kg)</option></select></div>
      <div class="row">
        <button class="ghost" id="export" type="button">Export backup</button>
        <button class="ghost" id="import" type="button">Import backup</button>
      </div>
      <input id="file" type="file" accept="application/json,.json" hidden>
      <div id="import-confirm" hidden class="row">
        <span class="muted" id="import-msg"></span>
        <button class="shrink confirm" id="import-yes" type="button">Replace</button>
        <button class="shrink ghost" id="import-no" type="button">Cancel</button>
      </div>
      <div class="status" id="status">Connecting…</div>
    </div>
  </section>
</main>

<nav aria-label="Sections">
  <button data-view="log" aria-current="page">Log</button>
  <button data-view="plan">Plan</button>
  <button data-view="history">History</button>
  <button data-view="progress">Progress</button>
</nav>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const CACHE = 'gymlog.v1';
const $ = s => document.querySelector(s);
const todayISO = () => new Date().toLocaleDateString('en-CA');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => new Date(d + 'T00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const e1rm = (w, r) => r === 1 ? w : w * (1 + r / 30); // Epley
const round = n => Math.round(n * 10) / 10;

/* ---------- the 8-week plan: 3 gym days around gymnastics and climbing, 2 sets per exercise ---------- */
// Exercise types: 'heavy' and 'moderate' lifts follow the weekly phases below; 'acc' accessories keep
// a fixed rep range; 'skill' is logged however you perform it.
const PLAN = {
  weeks: 8,
  sets: 2,
  days: [
    { name: 'Legs', when: 'Mon', note: 'After gymnastics', focus: 'Squat pattern, hamstrings, lower legs', ex: [
      { n: 'Back Squat', t: 'heavy' }, { n: 'Romanian Deadlift', t: 'moderate' }, { n: 'Bulgarian Split Squat', t: 'moderate' },
      { n: 'Standing Calf Raise', t: 'acc', reps: '10–15' }, { n: 'Tibialis Raise', t: 'acc', reps: '15–20' } ] },
    { name: 'Upper', when: 'Fri', note: 'Heavy day', focus: 'Heavy pressing and pulling, shoulder care', ex: [
      { n: 'Bench Press', t: 'heavy', core: true }, { n: 'Lat Pulldown', t: 'heavy', core: true }, { n: 'Zanetti Press', t: 'skill', core: true },
      { n: 'Incline Dumbbell Press', t: 'acc', reps: '8–12' }, { n: 'Lateral Raise', t: 'acc', reps: '12–20' },
      { n: 'External Rotation', t: 'acc', reps: '15–20' }, { n: 'Preacher Curl', t: 'acc', reps: '10–12' } ] },
    { name: 'Full Body', when: 'Sun', note: 'Lighter pressing and pulling, heavy hinge', focus: 'Deadlift, volume pressing, elbow care', ex: [
      { n: 'Paused Bench Press', t: 'moderate', core: true }, { n: 'Single-Arm Lat Pulldown', t: 'moderate', core: true }, { n: 'Zanetti Press', t: 'skill', core: true },
      { n: 'Trap Bar Deadlift', t: 'heavy' }, { n: 'Overhead Press', t: 'moderate' }, { n: 'Face Pull', t: 'acc', reps: '15–20' },
      { n: 'Hammer Curl', t: 'acc', reps: '10–12' }, { n: 'Reverse Wrist Curl', t: 'acc', reps: '15–20' } ] },
  ],
  // Rep targets for the phased lifts. Hit the top of the range on both sets, then add weight next time.
  phases: [
    { from: 1, to: 3, heavy: '6–8', moderate: '10–12', note: 'Build in. Stop 2 reps short of failure on heavy and moderate lifts; accessories can go to failure.' },
    { from: 4, to: 4, heavy: '6–8', moderate: '10–12', deload: true, note: 'Lighter week. Use about 85–90% of last week’s weights and stop 3 reps short. Let your elbows and shoulders catch up.' },
    { from: 5, to: 6, heavy: '5–6', moderate: '8–10', note: 'Heavier. Stop 1–2 reps short of failure on heavy and moderate lifts.' },
    { from: 7, to: 8, heavy: '3–5', moderate: '6–8', note: 'Heaviest block. Stop 1–2 reps short and never grind out a rep.' },
  ],
};
const targetFor = (e, ph) => e.t === 'skill' ? 'quality sets' : e.t === 'acc' ? `${e.reps} reps` : `${ph[e.t]} reps`;
const SESSIONS = [];
for (let w = 1; w <= PLAN.weeks; w++) PLAN.days.forEach((d, i) => SESSIONS.push({ key: `p3w${w}d${i + 1}`, week: w, day: i, ...d }));
const phaseFor = w => PLAN.phases.find(p => w >= p.from && w <= p.to);
// The workout after the furthest one you've finished (skipped workouts stay skipped).
const nextSession = () => {
  const last = Math.max(-1, ...state.done.map(k => SESSIONS.findIndex(s => s.key === k)));
  return SESSIONS[Math.min(last + 1, SESSIONS.length - 1)];
};
// Shown workout: the one you picked, else the one you're logging today, else the next one.
const current = () => {
  const picked = SESSIONS.find(s => s.key === state.current);
  if (picked) return picked;
  const todays = (state.days[todayISO()] || []).filter(t => t.session && !state.done.includes(t.session));
  const active = todays.length && SESSIONS.find(s => s.key === todays.at(-1).session);
  return active || nextSession();
};

// state.days: { 'YYYY-MM-DD': [{id, ex, w, r}] }, state.done: finished session keys
let state = { unit: 'lb', days: {}, done: [], current: null }; // current: the workout you're on, synced
try {
  const c = JSON.parse(localStorage.getItem(CACHE));
  if (c && c.days) state = { ...state, ...c };
  else if (c && Array.isArray(c.sets)) { // older flat format
    for (const { date, ...s } of c.sets) (state.days[date] ||= []).push(s);
    state.unit = c.unit || 'lb';
  }
} catch {}
state.done ||= [];
const cache = () => { try { localStorage.setItem(CACHE, JSON.stringify(state)); } catch {} };

/* ---------- storage: private per-person db, with a local queue that syncs automatically ---------- */
// Every change is saved in this browser first and queued. The queue is pushed to the account
// whenever a connection is available, merging with anything logged on other devices.
const QUEUE = 'gymlog.queue';
let queue = { days: {}, deleted: [], settings: false }; // days[date] = 'merge' | 'replace'
try { const q = JSON.parse(localStorage.getItem(QUEUE)); if (q && q.days) queue = { ...queue, ...q }; } catch {}
// First run of the syncing version: queue everything that so far only lived in this browser.
try {
  if (!localStorage.getItem('gymlog.synced-once')) {
    for (const d of Object.keys(state.days)) queue.days[d] ||= 'merge';
    if (state.done.length || state.unit !== 'lb') queue.settings = true;
  }
} catch {}
const saveQueue = () => { try { localStorage.setItem(QUEUE, JSON.stringify(queue)); } catch {} };
const hasQueued = () => Object.keys(queue.days).length > 0 || queue.settings;

let col = null, server = null, flushing = false, connecting = false;
function setStatus(kind) {
  const text = {
    synced: 'Synced', saving: 'Saving…', offline: 'Saved on this device · syncs when you are back online',
    local: 'Saved on this device · sign in to Claude to sync', connecting: 'Connecting…',
  }[kind];
  $('#status').textContent = text;
  $('#sync').textContent = text;
  $('#sync').dataset.kind = kind;
}

function queueDay(d, mode = 'merge') { if (queue.days[d] !== 'replace') queue.days[d] = mode; saveQueue(); cache(); flush(); }
const saveDay = d => queueDay(d);
const saveSettings = () => { queue.settings = true; saveQueue(); cache(); flush(); };

// Push queued changes, merging each queued day with the account's copy of that day.
async function flush() {
  if (!col || !server || flushing || !hasQueued()) { if (col && server && !hasQueued()) setStatus('synced'); return; }
  flushing = true; setStatus('saving');
  let failed = false;
  try {
    for (const d of Object.keys(queue.days)) {
      const mode = queue.days[d], del = new Set(queue.deleted);
      const local = JSON.stringify(state.days[d] || []);
      const byId = new Map();
      if (mode === 'merge') for (const s of server.days[d] || []) if (!del.has(s.id)) byId.set(s.id, s);
      for (const s of state.days[d] || []) byId.set(s.id, s);
      const sets = [...byId.values()].sort((a, b) => a.id - b.id);
      const ref = col.doc('day-' + d);
      await (sets.length ? ref.set({ date: d, sets }) : ref.delete());
      // If this day changed while saving, leave it queued so the next pass sends the newer copy.
      if (JSON.stringify(state.days[d] || []) === local) {
        if (sets.length) state.days[d] = sets; else delete state.days[d];
        delete queue.days[d];
      } else queue.days[d] = 'merge';
      saveQueue();
    }
    if (!Object.keys(queue.days).length) { queue.deleted = []; saveQueue(); }
    if (queue.settings) {
      queue.settings = false; saveQueue();
      try { await col.doc('settings').set({ unit: state.unit, done: state.done, current: state.current || null }); }
      catch (e) { queue.settings = true; saveQueue(); throw e; }
    }
    try { localStorage.setItem('gymlog.synced-once', '1'); } catch {}
    cache(); render();
    setStatus(hasQueued() ? 'saving' : 'synced');
  } catch (e) {
    failed = true;
    if (e.code === 'quota_exceeded') toast('Your account storage is full. Export a backup, then delete old days.');
    setStatus(navigator.onLine ? 'saving' : 'offline');
    setTimeout(flush, 15000); // try again shortly; nothing is lost meanwhile
  } finally {
    flushing = false;
    if (!failed && hasQueued() && col) setTimeout(flush, 0);
  }
}

async function connect() {
  if (col || connecting) return flush();
  if (!window.claude?.use) { setStatus('local'); return; }
  connecting = true; setStatus('connecting');
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) { setStatus('local'); return; }
    col = db.collection('data/users/' + uid);
    col.onSnapshot(snap => {
      const days = {}; let unit = 'lb', done = [], current = null;
      for (const doc of snap.docs) {
        const b = structuredClone(doc.data()); // snapshots are read-only; keep an editable copy
        if (doc.id === 'settings') { unit = b.unit || unit; done = Array.isArray(b.done) ? b.done : []; current = b.current || null; }
        else if (doc.id.startsWith('day-') && Array.isArray(b.sets)) days[b.date] = b.sets;
      }
      server = { unit, days, done, current };
      // Show the account's data, with this device's not-yet-synced changes layered on top.
      const next = { unit, days: { ...days }, done, current };
      for (const d of Object.keys(queue.days)) {
        const del = new Set(queue.deleted), byId = new Map();
        if (queue.days[d] === 'merge') for (const s of days[d] || []) if (!del.has(s.id)) byId.set(s.id, s);
        for (const s of state.days[d] || []) byId.set(s.id, s);
        if (byId.size) next.days[d] = [...byId.values()].sort((a, b) => a.id - b.id); else delete next.days[d];
      }
      if (queue.settings) { next.unit = state.unit; next.done = state.done; next.current = state.current; }
      state = next;
      cache(); render(); flush();
    }, () => { col = null; server = null; setStatus('offline'); setTimeout(connect, 15000); });
  } catch { setStatus('offline'); setTimeout(connect, 15000); }
  finally { connecting = false; }
}
addEventListener('online', connect);
document.addEventListener('visibilitychange', () => { if (!document.hidden) connect(); });

/* ---------- derived data ---------- */
const allSets = () => Object.entries(state.days).flatMap(([date, ss]) => ss.map(s => ({ ...s, date })));
const exercises = () => [...new Set(allSets().map(s => s.ex))].sort((a, b) => a.localeCompare(b));
const planExercises = () => [...new Set(PLAN.days.flatMap(d => d.ex.map(e => e.n)))];
const lastSet = name => allSets().filter(s => s.ex.toLowerCase() === name.toLowerCase())
  .sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id).pop();
const sessionSets = key => allSets().filter(t => t.session === key).sort((a, b) => a.id - b.id);
const group = sets => { const m = {}; for (const s of sets) (m[s.ex] ||= []).push(s); return Object.entries(m); };
function prIds() {
  const best = {}, ids = new Set();
  for (const s of allSets().sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id)) {
    const v = e1rm(s.w, s.r);
    if (v > (best[s.ex] ?? 0)) { best[s.ex] = v; ids.add(s.id); }
  }
  return ids;
}

/* ---------- plate math ---------- */
const PLATES = {
  lb: { bar: 45, list: [[45,'blue'],[35,'yellow'],[25,'green'],[10,'white'],[5,'black'],[2.5,'black']] },
  kg: { bar: 20, list: [[25,'red'],[20,'blue'],[15,'yellow'],[10,'green'],[5,'white'],[2.5,'black'],[1.25,'black']] },
};
function renderPlates() {
  const w = formValues().w, cfg = PLATES[state.unit];
  const el = $('#plates');
  if (!(w > cfg.bar)) { el.innerHTML = w === cfg.bar ? 'Empty bar.' : `Barbell math assumes a ${cfg.bar} ${state.unit} bar.`; return; }
  let side = (w - cfg.bar) / 2; const out = [];
  for (const [p, c] of cfg.list) while (side >= p - 1e-9) { out.push([p, c]); side -= p; }
  el.innerHTML = 'Per side:' + out.map(([p, c]) => `<span class="plate p-${c}">${p}</span>`).join('') +
    (side > 0.01 ? ` <span>+ ${round(side)} left over</span>` : '');
}

/* ---------- rendering ---------- */
let confirmFinish = null; // workout whose Finish button is waiting for confirmation
let editingId = null; // set currently open for editing
function setList(sets, prs) {
  return '<ul class="sets">' + sets.map((s, i) => s.id === editingId ? setEditor(s, i) : `
    <li><span><span class="idx">Set ${i + 1}</span><span class="num">${s.w}</span> ${state.unit} × <span class="num">${s.r}</span>${prs.has(s.id) ? '<span class="pr">PR</span>' : ''}</span>
    <button class="x" data-edit="${s.id}" type="button" aria-label="Edit set ${i + 1}">Edit</button></li>`).join('') + '</ul>';
}
function setEditor(s, i) {
  return `<li class="editing" data-id="${s.id}" data-date="${s.date}">
    <div class="eyebrow">Edit set ${i + 1}</div>
    <div><label>Exercise</label><input class="e-ex" list="ex-list" value="${esc(s.ex)}" aria-label="Exercise"></div>
    <div class="row">
      <div><label>Weight (${state.unit})</label><input class="e-w" type="number" inputmode="decimal" step="any" min="0" value="${s.w}" aria-label="Weight"></div>
      <div><label>Reps</label><input class="e-r" type="number" inputmode="numeric" min="1" value="${s.r}" aria-label="Reps"></div>
    </div>
    <div><label>Workout</label><select class="e-session" aria-label="Workout">
      <option value="">Not part of the plan</option>
      ${SESSIONS.map(o => `<option value="${o.key}"${o.key === s.session ? ' selected' : ''}>Week ${o.week} · ${o.when} ${o.name}</option>`).join('')}
    </select></div>
    <div class="row">
      <button type="button" data-save>Save</button>
      <button type="button" class="ghost" data-cancel>Cancel</button>
      <button type="button" class="x shrink" data-del="${s.id}" data-date="${s.date}">Delete</button>
    </div>
  </li>`;
}
const volume = ss => ss.reduce((a, s) => a + s.w * s.r, 0).toLocaleString();

function renderLog(prs) {
  const d = todayISO();
  $('#today-label').textContent = fmtDate(d);
  const sets = (state.days[d] || []).map(s => ({ ...s, date: d }));
  $('#today').innerHTML = sets.length
    ? group(sets).map(([ex, ss]) => `<div class="card"><div class="head"><h2>${esc(ex)}</h2>
        <span class="muted">${volume(ss)} ${state.unit} volume</span></div>${setList(ss, prs)}</div>`).join('')
    : `<div class="card empty"><h2>No sets yet today</h2><p class="muted" style="margin:0">Type an exercise, weight and reps above, then tap Add set. Your sets show up here.</p></div>`;
  const names = [...new Set([...planExercises(), ...exercises()])].sort((a, b) => a.localeCompare(b));
  $('#ex-list').innerHTML = names.map(e => `<option value="${esc(e)}">`).join('');
}

function renderSession() {
  const s = current(), ph = phaseFor(s.week), done = state.done.includes(s.key);
  const logged = sessionSets(s.key);
  const count = name => logged.filter(t => t.ex.toLowerCase() === name.toLowerCase()).length;
  $('#session').innerHTML = `
    <div class="head">
      <div><div class="eyebrow">Week ${s.week} of ${PLAN.weeks} · ${s.when}${ph.deload ? ' · Lighter week' : ''}${done ? ' · Finished' : ''}</div><h2>${s.name}</h2><div class="muted">${s.note}</div></div>
      <select id="session-pick" aria-label="Choose session" style="width:auto">
        ${SESSIONS.map(o => `<option value="${o.key}"${o.key === s.key ? ' selected' : ''}>W${o.week} · ${o.when} ${o.name}${state.done.includes(o.key) ? ' ✓' : ''}</option>`).join('')}
      </select>
    </div>
    <div class="phase"><b>${PLAN.sets} sets of everything.</b> ${ph.note} Hit the top of the rep range on both sets, then add weight next time.</div>
    <ul class="plan-list">${s.ex.map(e => {
      const n = count(e.n), last = lastSet(e.n);
      return `<li><button type="button" data-fill="${esc(e.n)}">
        <span>${esc(e.n)}${e.core ? '<span class="core">Core</span>' : ''}
          <span class="meta">${PLAN.sets} × ${targetFor(e, ph)} · ${last ? `Last: ${last.w} ${state.unit} × ${last.r}` : 'Not logged yet'}</span></span>
        <span class="count${n >= PLAN.sets ? ' full' : ''}">${Math.min(n, 9)}/${PLAN.sets}</span></button></li>`; }).join('')}
    ${[...new Set(logged.map(t => t.ex))].filter(n => !s.ex.some(e => e.n.toLowerCase() === n.toLowerCase())).map(n => `
      <li><button type="button" data-fill="${esc(n)}"><span>${esc(n)}<span class="meta">Extra, not in this workout's plan</span></span>
        <span class="count">${logged.filter(t => t.ex === n).length}</span></button></li>`).join('')}
    </ul>
    ${confirmFinish !== s.key
      ? `<button type="button" id="finish" class="${done ? 'ghost' : ''}">${done ? 'Mark as not finished' : 'Finish workout'}</button>`
      : `<div class="confirm-box" role="alert">
          <div>${done ? `Reopen week ${s.week} ${s.name}? It will count as not finished.`
            : `Finish week ${s.week} ${s.name}? You've logged ${s.ex.reduce((a, e) => a + Math.min(count(e.n), PLAN.sets), 0)} of ${s.ex.length * PLAN.sets} planned sets.`}</div>
          <div class="row"><button type="button" id="finish-yes">${done ? 'Reopen' : 'Finish'}</button>
            <button type="button" class="ghost" id="finish-no">Cancel</button></div>
        </div>`}`;
}

function renderPlan() {
  const cur = current().key;
  $('#plan-grid').innerHTML = `
    <div class="muted">${state.done.length} of ${SESSIONS.length} workouts finished. Tap a workout to open it.</div>
    <div class="weeks">
      <span></span>${PLAN.days.map(d => `<span class="colhead">${d.when}</span>`).join('')}
      ${Array.from({ length: PLAN.weeks }, (_, i) => `<span class="wk">W${i + 1}</span>` +
        SESSIONS.filter(s => s.week === i + 1).map(s => `<button type="button" data-go="${s.key}"
          class="sess${state.done.includes(s.key) ? ' done' : ''}${s.key === cur ? ' current' : ''}"
          aria-label="Week ${s.week} ${s.when} ${s.name}${state.done.includes(s.key) ? ', finished' : ''}">${s.name}</button>`).join('')).join('')}
    </div>
    <div style="display:grid;gap:6px">${PLAN.phases.map(p => `<div class="phase"><b>${p.from === p.to ? 'Week ' + p.from : `Weeks ${p.from}–${p.to}`}:</b> heavy lifts ${p.heavy}, moderate lifts ${p.moderate} reps. ${p.note}</div>`).join('')}</div>`;
  $('#plan-days').innerHTML = PLAN.days.map(d => `<div class="card template">
      <div class="head"><h2>${d.when} · ${d.name}</h2><span class="muted">${d.note}</span></div>
      <div class="muted">${d.focus}</div>
      <ol>${d.ex.map(e => `<li>${esc(e.n)}${e.core ? '<span class="core">Core</span>' : ''} <span class="muted">${e.t === 'acc' ? e.reps : e.t === 'skill' ? 'as you perform it' : e.t + ' (phased)'}</span></li>`).join('')}</ol>
    </div>`).join('') + `<p class="muted" style="margin:0">Gymnastics Mon, Tue and Thu (legs follow Monday's session). Climbing Wed and some Saturdays. Rows and core work are left out on purpose, since your sports already cover them.</p>`;
}

function showView(name) {
  document.querySelectorAll('nav button').forEach(n => n.dataset.view === name ? n.setAttribute('aria-current', 'page') : n.removeAttribute('aria-current'));
  document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== 'view-' + name);
  window.scrollTo(0, 0);
}

function renderHistory(prs) {
  const days = Object.keys(state.days).filter(d => state.days[d].length).sort().reverse();
  $('#history').innerHTML = days.length
    ? days.map(d => { const ss = state.days[d].map(s => ({ ...s, date: d }));
        const labels = [...new Set(ss.map(t => SESSIONS.find(o => o.key === t.session)).filter(Boolean).map(o => `Week ${o.week} ${o.name}`))];
        return `<div class="card"><div class="head"><div><h2>${fmtDate(d)}</h2>${labels.length ? `<div class="muted">${labels.join(' · ')}</div>` : ''}</div><span class="muted">${ss.length} set${ss.length === 1 ? "" : "s"} · ${volume(ss)} ${state.unit}</span></div>
        ${group(ss).map(([ex, g]) => `<div><div class="eyebrow">${esc(ex)}</div>${setList(g, prs)}</div>`).join('')}</div>`; }).join('')
    : `<div class="card empty"><h2>Nothing logged yet</h2><p class="muted" style="margin:0">Every workout you log appears here by day.</p></div>`;
}

function renderProgress() {
  const exs = exercises(), pick = $('#pick'), cur = pick.value;
  pick.innerHTML = exs.map(e => `<option>${esc(e)}</option>`).join('');
  pick.disabled = !exs.length;
  if (exs.includes(cur)) pick.value = cur;
  const ex = pick.value;
  if (!ex) { $('#progress').innerHTML = '<p class="muted empty">Log a few sessions and your estimated one-rep max trend shows up here.</p>'; return; }
  const sets = allSets().filter(s => s.ex === ex);
  const byDay = {};
  for (const s of sets) byDay[s.date] = Math.max(byDay[s.date] || 0, e1rm(s.w, s.r));
  const pts = Object.entries(byDay).sort((a, b) => a[0].localeCompare(b[0]));
  const best = sets.reduce((b, s) => e1rm(s.w, s.r) > e1rm(b.w, b.r) ? s : b);
  $('#progress').innerHTML = `
    <div class="stats">
      <div class="stat"><span class="num">${round(e1rm(best.w, best.r))}</span><span>Est. 1RM</span></div>
      <div class="stat"><span class="num">${Math.max(...sets.map(s => s.w))}</span><span>Heaviest</span></div>
      <div class="stat"><span class="num">${pts.length}</span><span>Sessions</span></div>
    </div>
    ${chart(pts)}
    <p class="muted" style="margin:0">Best set: ${best.w} ${state.unit} × ${best.r} on ${fmtDate(best.date)}. The chart plots each session's best estimated one-rep max (Epley formula).</p>`;
}

function chart(pts) {
  if (pts.length < 2) return '<p class="muted" style="margin:0">Log this exercise on two or more days to see a trend line.</p>';
  const W = 340, H = 170, P = { l: 40, r: 12, t: 12, b: 24 };
  const ys = pts.map(p => p[1]);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 10) { const m = (hi + lo) / 2; lo = m - 5; hi = m + 5; }
  const step = Math.pow(10, Math.floor(Math.log10((hi - lo) / 2)));
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => P.l + (i / (pts.length - 1)) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  const ticks = [lo, (lo + hi) / 2, hi];
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
  const area = `${line} L${x(pts.length - 1).toFixed(1)},${y(lo)} L${x(0).toFixed(1)},${y(lo)} Z`;
  const short = s => new Date(s + 'T00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const last = pts.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Estimated one-rep max by session">
    ${ticks.map(v => `<line class="c-grid" x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}"/>
      <text class="c-label" x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end">${round(v)}</text>`).join('')}
    <path class="c-area" d="${area}"/><path class="c-line" d="${line}"/>
    ${pts.map((p, i) => `<circle class="${i === last ? 'c-end' : 'c-dot'}" cx="${x(i)}" cy="${y(p[1])}" r="${i === last ? 4.5 : 3}"><title>${short(p[0])}: ${round(p[1])}</title></circle>`).join('')}
    <text class="c-label" x="${P.l}" y="${H - 5}">${short(pts[0][0])}</text>
    <text class="c-label" x="${W - P.r}" y="${H - 5}" text-anchor="end">${short(pts[last][0])}</text>
  </svg>`;
}

function render() {
  document.querySelectorAll('.unit').forEach(el => el.textContent = state.unit);
  $('#unit').value = state.unit;
  const prs = prIds();
  renderSession(); renderPlan(); renderLog(prs); renderHistory(prs); renderProgress(); updatePlaceholders();
}

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3500); }

/* ---------- actions ---------- */
/* ---------- form preview text ----------
   Blank fields show the previous set as grey preview text and use it when you tap Add set.
   Exercise: the one you just logged (until its sets are done), else the next unfinished plan exercise.
   Weight and reps: your last set of that exercise, else the empty bar and the bottom of the target range. */
function suggestedExercise() {
  const s = current(), logged = sessionSets(s.key);
  const done = name => logged.filter(t => t.ex.toLowerCase() === name.toLowerCase()).length >= PLAN.sets;
  const prev = logged.at(-1);
  if (prev && !done(prev.ex)) return prev.ex;
  return (s.ex.find(e => !done(e.n)) || s.ex[0]).n;
}
function defaultReps(name) {
  const s = current(), e = s.ex.find(x => x.n.toLowerCase() === name.toLowerCase());
  if (!e || e.t === 'skill') return 5;
  return parseInt(e.t === 'acc' ? e.reps : phaseFor(s.week)[e.t], 10);
}
const formValues = () => {
  const ex = $('#ex').value.trim() || $('#ex').placeholder;
  return { ex, w: parseFloat($('#w').value || $('#w').placeholder), r: parseInt($('#r').value || $('#r').placeholder, 10) };
};
function updatePlaceholders() {
  $('#ex').placeholder = suggestedExercise();
  const name = $('#ex').value.trim() || $('#ex').placeholder, last = lastSet(name);
  $('#w').placeholder = last ? last.w : PLATES[state.unit].bar;
  $('#r').placeholder = last ? last.r : defaultReps(name);
  renderPlates();
}

$('#add-form').addEventListener('submit', e => {
  e.preventDefault();
  const { ex, w, r } = formValues();
  if (!ex) return $('#ex').focus();
  if (!(w >= 0)) return $('#w').focus();
  if (!(r > 0)) return $('#r').focus();
  const name = [...exercises(), ...planExercises()].find(n => n.toLowerCase() === ex.toLowerCase()) || ex;
  const d = todayISO();
  if (state.current !== current().key) { state.current = current().key; saveSettings(); }
  state.days[d] = [...(state.days[d] || []), { id: Date.now() * 1000 + Math.floor(Math.random() * 1000), ex: name, w, r, session: current().key }];
  $('#ex').value = $('#w').value = $('#r').value = '';
  render(); saveDay(d);
});

$('#ex').addEventListener('input', updatePlaceholders);

// Plan interactions: tap an exercise to load it into the form, pick or finish a session.
document.addEventListener('click', e => {
  const fill = e.target.closest('[data-fill]');
  if (fill) {
    $('#ex').value = fill.dataset.fill;
    $('#w').value = $('#r').value = '';
    updatePlaceholders();
    $('#add-form').scrollIntoView({ block: 'nearest' });
    return;
  }
  const go = e.target.closest('[data-go]');
  if (go) { state.current = go.dataset.go; render(); saveSettings(); showView('log'); return; }
  if (e.target.closest('#finish')) { confirmFinish = current().key; render(); return; }
  if (e.target.closest('#finish-no')) { confirmFinish = null; render(); return; }
  if (e.target.closest('#finish-yes')) {
    const s = current();
    confirmFinish = null;
    if (state.done.includes(s.key)) { state.done = state.done.filter(k => k !== s.key); state.current = s.key; }
    else { state.done = [...state.done, s.key]; state.current = nextSession().key; toast(`${s.name} finished. Next up: ${nextSession().name}, week ${nextSession().week}.`); }
    render(); saveSettings();
  }
});
document.addEventListener('change', e => { if (e.target.id === 'session-pick') { state.current = e.target.value; render(); saveSettings(); } });
$('#w').addEventListener('input', renderPlates);

// Edit a logged set: weight, reps, exercise, or which workout it counts toward.
document.addEventListener('click', e => {
  const open = e.target.closest('[data-edit]');
  if (open) { editingId = Number(open.dataset.edit); render(); return; }
  if (e.target.closest('[data-cancel]')) { editingId = null; render(); return; }
  if (!e.target.closest('[data-save]')) return;
  const li = e.target.closest('li.editing'), d = li.dataset.date, id = Number(li.dataset.id);
  const ex = li.querySelector('.e-ex').value.trim(), w = parseFloat(li.querySelector('.e-w').value), r = parseInt(li.querySelector('.e-r').value, 10);
  if (!ex) return li.querySelector('.e-ex').focus();
  if (!(w >= 0)) return li.querySelector('.e-w').focus();
  if (!(r > 0)) return li.querySelector('.e-r').focus();
  const name = [...exercises(), ...planExercises()].find(n => n.toLowerCase() === ex.toLowerCase()) || ex;
  const session = li.querySelector('.e-session').value || undefined;
  state.days[d] = (state.days[d] || []).map(s => s.id === id ? { id, ex: name, w, r, ...(session ? { session } : {}) } : s);
  editingId = null;
  render(); saveDay(d); toast('Set updated');
});

// Two-tap delete: first tap arms the button, second tap deletes.
document.addEventListener('click', e => {
  const b = e.target.closest('[data-del]');
  document.querySelectorAll('.x.armed').forEach(x => { if (x !== b) { x.classList.remove('armed'); x.textContent = 'Delete'; } });
  if (!b) return;
  if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Tap to confirm'; return; }
  const d = b.dataset.date, id = Number(b.dataset.del);
  state.days[d] = (state.days[d] || []).filter(s => s.id !== id);
  queue.deleted = [...new Set([...queue.deleted, id])];
  if (!state.days[d].length) delete state.days[d];
  editingId = null;
  render(); saveDay(d); toast('Set deleted');
});

document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));

$('#pick').addEventListener('change', renderProgress);
$('#unit').addEventListener('change', e => { state.unit = e.target.value; render(); saveSettings(); });

$('#export').addEventListener('click', async () => {
  const data = JSON.stringify(state, null, 2);
  const filename = `gym-log-${todayISO()}.json`;
  if (!window.claude?.use) { // plain browser, outside Claude
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = filename; a.click();
    return;
  }
  const dl = await claude.use('downloads');
  if (!dl) { toast('Saving files is not available here.'); return; }
  try { await dl.save({ filename, data }); toast('Backup saved'); }
  catch (err) { if (err.code !== 'declined') toast('Could not save the backup.'); }
});

let pending = null;
$('#import').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async e => {
  try {
    const data = JSON.parse(await e.target.files[0].text());
    // Accept this page's format and the older flat {sets:[{date,...}]} format.
    let days = data.days;
    if (!days && Array.isArray(data.sets)) { days = {}; for (const { date, ...s } of data.sets) (days[date] ||= []).push(s); }
    if (!days || typeof days !== 'object') throw 0;
    pending = { unit: data.unit === 'kg' ? 'kg' : 'lb', days, done: Array.isArray(data.done) ? data.done : [], current: data.current || null };
    const n = Object.values(days).reduce((a, s) => a + s.length, 0);
    $('#import-msg').textContent = `Replace your log with ${n} sets from this file?`;
    $('#import-confirm').hidden = false;
  } catch { toast('That file is not a Gym Log backup. Choose a .json file made with Export backup.'); }
  e.target.value = '';
});
$('#import-no').addEventListener('click', () => { pending = null; $('#import-confirm').hidden = true; });
$('#import-yes').addEventListener('click', async () => {
  if (!pending) return;
  const old = Object.keys(state.days);
  state = pending; pending = null; $('#import-confirm').hidden = true;
  render();
  for (const d of new Set([...old, ...Object.keys(state.days)])) queue.days[d] = 'replace';
  saveSettings();
  toast('Backup imported');
});

render();
connect();
</script>

</body>
</html>
